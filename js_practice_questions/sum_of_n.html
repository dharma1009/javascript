<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of n numbers</title>
</head>
<body>
    <script>
        function sum_of_n(n){
            sum =0
            for(i=1;i<=n;i++){
                sum =sum+i
            }
            return sum

        }
        let s =sum_of_n(9)
        console.log(s)

    </script>
</body>
</html>
