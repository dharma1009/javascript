<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>splice and index using reverse</title>
</head>
<body>
    <script>
        let arr =["january","july","march","august"]
        arr.splice(0,2,"july","june")
        console.log(arr)

        let prog = ["c","c++","html","javascript","python","java","c#","sql"]
        res = prog.reverse().indexOf("javascript")
        console.log(res)
        
    </script>
</body>
</html>
