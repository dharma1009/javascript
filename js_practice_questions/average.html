<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Average  using function</title>
</head>
<body>
    <script>
        function average(a,b,c){
             let avg =(a+b+c)/3
             console.log(avg)
        }
        average(10,20,30)
        average(20,30,40)
    </script>
</body>
