<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>concate</title>
</head>
<body>
    <script>
        function concate(str){
            let result = ""
            for(let i=0;i<str.length;i++){
                result +=str[i]
            }
            return result
        }
        let str =["hii","hello","bye"]
        console.log(str);
        console.log(concate(str))
    </script>
</body>
</html>
