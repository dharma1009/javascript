<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multiples</title>
</head>
<body>
    <script>
        let nums = [10,20,30,40,50,60]
        let ans = nums.every((ele)=>{
            return ele%10 ==0
        })
        console.log(ans)
    </script>
</body>
</html>
