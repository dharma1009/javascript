    <title>traffic light system</title>

<body>
    <script>
        let color ="green";
        if(color=="red"){
            console.log("stop light color is red")
        }
        if(color=="yellow"){

        }
        if(color=="green"){
            console.log("go light color is green")
        }
    </script>
