<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day of the week</title>
</head>
<body>
    <script>
        let day = "8";
        switch(day){
            case "1":
                console.log("monday");
            break;
            case "2":
                console.log("tueday");
            break;
            case "3":
                console.log("wednesday");
            break;
            case "4":
                console.log("thursday");
            break;
            case "5":
                console.log("friday");
            break;
            case "6":
                console.log("saturday");
            break;
            case "7":
                console.log("sunday");
            break;
            default:
                console.log("day is not found")
        }
    </script>
</body>
</html>
