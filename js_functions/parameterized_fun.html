<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>parameterized function</title>
</head>
<body>
    <script>
        function nameinfo(name,age){
            console.log(`${name}'s and age is ${age}`)
        }
        nameinfo("dharma",21)
        nameinfo("sharma",38)


        function sum(a,b){
            console.log(a+b)
        }
        sum(10,22)
        sum(30,9)
        sum(3,5)
    </script>
</body>
</html>
