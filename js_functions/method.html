<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehtod.js</title>
</head>
<body>
    <script>
        const calculator ={
            add:function(a,b){
                return a+b
            },
            sub:function(a,b){
                return a-b
            },
            mul:function(a,b){
                return a*b
            }
        }
         
        console.log(calculator.add(2,5))
        console.log(calculator.sub(2,5))
        console.log(calculator.mul(2,5))
    </script>
</body>
