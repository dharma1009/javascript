<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>return function</title>
</head>
<body>
    <script>
        function sum(a,b){
            return a+b
        }
        let s = sum(10,20)
        console.log(s)

        function isadult(age){
            if(age>=18){
                return "adult"
            }
            else{
                return "not adult"
            }
        }
        let b = isadult(90)
        console.log(b)
    </script>
</body>
</html>
