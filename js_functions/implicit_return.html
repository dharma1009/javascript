<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>implicit return in arrow function</title>
</head>
<body>
    <script>
        const sum =(a,b)=>(
            a+b
        )
        console.log(sum(2,5))

        const pow =(a,b)=>(
            a**b
        )
        console.log(pow(2,3))

        const cube =(a)=>(
            a*a*a
        )
        console.log(cube(5))
    </script>
</body>
</html>
