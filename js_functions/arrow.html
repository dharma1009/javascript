<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow function</title>
</head>
<body>
    <script>
        const sum=(a,b)=>{
            console.log(a+b)

        }
        sum(2,5)

        const cube=(n)=>{
            console.log(n*n*n)
        }
        cube(5)

        const pow=(a,b)=>{
            return a**b
        }
        console.log(pow(7,3))
    </script>
</body>
</html>
