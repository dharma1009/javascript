<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
</head>
<body>
    <script>
        let quater = "1"
        switch(quater){
            case "1":
                console.log("january")
                console.log("february")
                console.log("march")
                break
                
            case "2":
                console.log("april")
                console.log("may")
                console.log("june")
                 break
                
            case "3":
                console.log("july")
                console.log("august")
                console.log("sepetember")
                 break
            case "4":
                console.log("october")
                console.log("november")
                console.log("december")
            default:
                console.log("year out of bound")

            
        }
    </script>
</body>
</html>
