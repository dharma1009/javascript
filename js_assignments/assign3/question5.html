<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>largest number</title>
</head>
<body>
    <script>
        let arr = [2,5,10,4,2,7,1,9]
        let largest = 0
        for(let i=0;i<=arr.length;i++){
            if(largest < arr[i]){
                largest = arr[i]
            }
        }
        console.log(largest)
    </script>
</body>
</html>
