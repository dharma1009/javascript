<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>factorial</title>
</head>
<body>
    <script>
        let n = 5
        fact = 1
        for(let i=1;i<=n;i++){
            fact *=i
        }
        console.log(`fact of ${n} is ${fact}`)
    </script>
</body>
</html>
