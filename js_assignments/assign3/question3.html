<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sum</title>
</head>
<body>
    <script>
        let num = 287152;
        let sum =0
        let copy = num
        while(copy>0){
            digits = copy%10
            sum+=digits
            copy=Math.floor(copy/10)
        }
        console.log(sum)
    </script>
</body>
</html>
