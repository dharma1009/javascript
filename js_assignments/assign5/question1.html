<body>
    <h3>
        Write a JavaScript function that returns array elements largerthan a number.
    </h3>
    <script>
        let arr = [9,2,4,6,7,1,3,5,8,10]
        let num = 5
        function getelement(){
            for(let i=0;i<arr.length;i++){
                if(arr[i]>num){
                    console.log(arr[i])
                }
            }
        }
        getelement(arr,num)
    </script>
