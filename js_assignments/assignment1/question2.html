<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>username using prompt</title>
</head>
<body>
    <script>
        username = prompt("enter your username:")
        age = prompt("enter your age:")
        msg = (`${username} is ${age} years old`)
        alert(msg)
    </script>
</body>
</html>
