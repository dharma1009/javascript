<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>else if</title>
</head>
<body>
    <script>
        let marks = 20;
        if (marks>=80){
            console.log("A+")
        }
        else if(marks>=60){
            console.log("A")
        }
        else if(marks>=45){
            console.log("B")
        }
        else if(marks<=45){
            console.log("F")
        }

        let month ="january"
        if(month == "january"){
            console.log("winter is here")
        }
        else if(month =="april"){
            console.log("summer is here")
        }
    </script>
</body>
</html>
