<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
</head>
<body>
    <script>
        let color ="red"
        switch(color){
            case "red":
                console.log("stop");
                break;
            case "yellow":
                console.log("slow down");
                break;
            case "green":
                console.log("go");
                break;
            default:
                console.log("light is  broken")

        }
    </script>
</body>
</html>
