<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nested if else</title>
</head>
<body>
    <script>
         let marks = 45;
         if(marks>=35){
            console.log("pass")
        if(marks>=80){
            console.log("Grde:0")
        }
        else{
            console.log("Grade:A")
        }
         }
         else{
            console.log("fail")
         }
    </script>
</body>
</html>
