<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>logical operators</title>
</head>
<body>
    <h1>logical operators</h1>
    <script>
        // logical and
        let marks = 80;
        if (marks >= 35 && marks >= 80){
            console.log("pass")
            console.log("A+")
        }
        // logical or
        let mark = 80;
        if(mark>=30 || mark >=80){
            console.log("pass")
            console.log("A")
        }

        // logical not
        let score = 35;
        if (!score<35){
            console.log("pass")
            console.log("try to inprove")
        }
    </script>
</body>
</html>
