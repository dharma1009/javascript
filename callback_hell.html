<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>call back hell</title>
</head>
<body>
    <h1>Hello World</h1>

    <script>
        h1 = document.querySelector("h1");
        function changecolor(color,delay,nextcolorchange){
            setTimeout(()=>{
                h1.style.color = color;
                        if(nextcolorchange) nextcolorchange();
            },delay);
        }
        changecolor("red",1000 ,()=>{
            changecolor("green",1000,()=>{
                changecolor("orange",1000,()=>{
                    changecolor("yellow",1000,()=>{
                        changecolor("blue",1000,)
                    })
                })
            })
        })


        // console.log("Coustomer enters resturent");
        // setTimeout(()=>{
        //     console.log("waiter takes order");
        //     setTimeout(()=>{
        //         console.log("chef start cooking")
        //         setTimeout(()=>{
        //             console.log("food is ready")
        //             setTimeout(()=>{
        //                 console.log("waiter serve food")
        //                 setTimeout(()=>{
        //                     console.log("customer start eating")
        //                     setTimeout(()=>{
        //                         console.log("customer pays bill")
        //                     },1000)
        //                 },1000)
        //             },1000)
        //         },1000)
        //     },1000)
        // },1000)

        // example for promise

        function step(message,time){
            return new Promise((resolve)=>{
                setTimeout(()=>{
                    console.log(message)
                    resolve()
                },time)
            })
        }
        step("customer enters resturant",1000)
        .then(()=>step("waiter takes order",1000))
        .then(()=>step("chef starts cooking",1000))
        .then(()=>step("food is ready",1000))
        .then(()=>step("waiter serve food",1000))
        .then(()=>step("customer starts eating",1000))
        .then(()=>step("customer pays the bills",1000))
        .catch((error)=>console.error("error",error))
    </script>
</body>
</html>
