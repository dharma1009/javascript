<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random integers</title>
</head>
<body>
    <script>
        let num = Math.random()
        num1 = num*10
        num2 = Math.floor(num1)
        num3 = num2+9

        console.log(num3)
        let random = Math.floor(Math.random()*10+1)
        console.log(random)
    </script>
</body>
</html>
