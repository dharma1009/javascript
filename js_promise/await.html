<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Await</title>
</head>
<body>
    <script>
        function getNum(){
            return new Promise((reslove,reject)=>{
                setTimeout(()=>{
                    let num = Math.floor(Math.random()*10)+1;
                    console.log(num);
                    reslove();
                },1000);
            });
        }
        async function demo(){
            await getNum();
            await getNum();
            await getNum();
            await getNum();
            getNum();
        }
        console.log(demo())
    </script>
</body>
</html>
