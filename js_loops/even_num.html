<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even num</title>
</head>
<body>
    <script>
        for(let i=2;i<=10;i++){
            if(i%2 ==0){
                console.log(i)
            }
        }

        for(let i=2;i<=10;i=i+2){
            console.log(i)
        }
        console.log("backward")

        for(let i=10;i>=2;i=i-2){
            console.log(i)
        }
    </script>
</body>
</html>
