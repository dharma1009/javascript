<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loop with nested array</title>
</head>
<body>
    <script>
        let heros = [["iron man","spider man","thor"],["superman","wonder women","flash"]]
        for(let i =0;i<=heros.length;i++){
            console.log(i,heros[i],heros[i].length)
            for(let j=0;j<=heros.length;j++){
                console.log(`j=${j},${heros[i][j]}`)
            }
        }
    </script>
</body>
</html>
