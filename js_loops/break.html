<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>break</title>
</head>
<body>
    <script>
        let i =1
        while(i<=5){
            if(i==3){
                break
            }
            console.log(i)
            i=i+1
        }
        console.log("we use break at 3")
    </script>
</body>
</html>
