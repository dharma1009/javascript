<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>odd_numbers form 1 to 15</title>
</head>
<body>
    <script>
        for(let i=0;i<=15;i++){
            if(i%2 !=0){
                console.log(i)
            }
        }
        console.log("backwards")

        for(let i=15;i>=1;i--){
            if(i%2 !=0){
                console.log(i)
            }
        }
    </script>
</body>
</html>
