<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sum and every </title>
</head>
<body>
    <script>
        // return every function should follow the conditions
        let n = [1,2,3,4,5,6]
        let ans = n.every((ele)=>{
            return ele%2 ==0
        })
        console.log(ans)
        // some if some of the elements follow the condition then it will return true
        let s = [1,2,3,4]
        let anss = s.some((ele)=>{
            return ele%2 ==0
        })
        console.log(anss)
    </script>
</body>
</html>
