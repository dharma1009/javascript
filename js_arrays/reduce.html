<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reduce</title>
</head>
<body>
    <script>
        // reduces the  values into single value
        let nums = [1,2,3,4]
        let finalvalue = nums.reduce((res,el)=>(res+el))
        console.log(finalvalue)
    </script>
</body>
</html>
