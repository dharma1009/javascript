<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>push&pop</title>
</head>
<body>
    <script>
        let cars = ["audi","bmw","benz","swift"]
        console.log(cars)
        cars.push("toyato")
        console.log(cars)
        cars.pop()
        console.log(cars)

    </script>
</body>
</html>
