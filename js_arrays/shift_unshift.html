<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unshift%shift</title>
</head>
<body>
    <script>
        let cars = ["audi","benz","maruthi","toyato"]
        console.log(cars)
        cars.unshift("ferreri")
        console.log(cars)
        cars.shift()
        console.log(cars)
    </script>
</body>
</html>
