<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>map and filtter function</title>
</head>
<body>
    <script>
        //map
        let num = [1,2,3,4,5]
        let double = num.map(ele=>{
            return ele*ele
        })
        console.log(double)

        let nums = [1,2,3,4,5,8,7,6,5,43,2]
        let ans = nums.filter(ele=>{
            return ele%2 ==0
        })
        console.log(ans)
    </script>
</body>
</html>
