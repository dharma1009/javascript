<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slice</title>
</head>
<body>
    <script>
        let colors = ["red","yellow","blue","orange","pink","white"]
        res = colors.slice()
        res1 = colors.slice(2)
        res2 = colors.slice(2,3)
        res3 = colors.slice(-2)
        console.log(res)
        console.log(res1)
        console.log(res2)
        console.log(res3)
    </script>
</body>
</html>
