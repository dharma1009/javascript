<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>concate and reverse</title>
</head>
<body>
    <script>
        let primary = ["red","blue","green"]
        console.log(primary)
        let secondary = ["orange","yellow","pink"]
        console.log(secondary)
        res = primary.concat(secondary)
        console.log(res)

        res1 = res.reverse()
        console.log(res1)
    </script>
</body>
</html>
